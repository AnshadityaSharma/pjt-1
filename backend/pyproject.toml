[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-backend"
version = "1.0.0"
description = "Control, safety, planning and telemetry backend for the autonomous survey rover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0.30,<2.1",
    "PyYAML>=6.0",
    "shapely>=2.0.4,<3",
    "numpy>=1.26",
    "httpx>=0.27",
    "Pillow>=10.3",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# GPIO libraries are optional on laptops. Raspberry Pi OS can provide them via
# apt (python3-gpiozero/python3-lgpio) with a --system-site-packages venv.
pi = ["gpiozero>=2.0,<3", "lgpio>=0.2.2.0; sys_platform == 'linux'"]
vision = ["onnxruntime>=1.18"]
camera-v4l2 = ["opencv-python-headless>=4.8"]
vision-ultralytics = ["ultralytics>=8.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "onnx>=1.15", "onnxruntime>=1.18"]

[project.scripts]
rover-backend = "rover.__main__:main"

[tool.setuptools.packages.find]
include = ["rover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
